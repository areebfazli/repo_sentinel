name: RepoSentinel PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege: read the code, comment on the PR.
permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: RepoSentinel Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runner dependency
        run: pip install requests

      - name: Run RepoSentinel scan
        env:
          # Built-in token — no PAT needed. Scoped by the permissions block above.
          GITHUB_TOKEN: ${{ github.token }}
          # Your hosted RepoSentinel backend + its shared secret.
          REPOSENTINEL_URL: ${{ secrets.REPOSENTINEL_URL }}
          REPOSENTINEL_API_KEY: ${{ secrets.REPOSENTINEL_API_KEY }}
          # Fail the check when a finding is at/above this severity
          # (none | low | medium | high | critical).
          INPUT_FAIL_ON_SEVERITY: high
          # Fail the check when the LLM review was partial or failed (units not
          # reviewed: budget, rate limits, errors), instead of passing as clean.
          INPUT_FAIL_ON_PARTIAL: "true"
          # Let deterministic diff-pattern findings (guard_diff alerts) fail the
          # check on their own. Off: they must be corroborated by the LLM review
          # or Semgrep to count towards the severity gate.
          INPUT_GATE_ON_DETERMINISTIC: "false"
        run: python github_action/scan_pr.py
