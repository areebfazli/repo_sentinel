# Tooling config only — this project is run as modules from the repo root,
# it is not an installed package.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: tests that load ML models or hit the eval harness (deselect with -m 'not slow')",
    "integration: end-to-end tests that exercise the FastAPI app",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv", "qdrant_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI idiom: Depends()/Header()/etc. in argument defaults is intentional.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# These carry large embedded text (an LLM prompt template / mock PR corpus) where
# wrapping mid-sentence hurts readability. report_generator is replaced in Phase 4;
# the mock block in ingest_team_history is replaced in Phase 5.
"backend/app/core/report_generator.py" = ["E501"]
"scripts/ingest_team_history.py" = ["E501"]
